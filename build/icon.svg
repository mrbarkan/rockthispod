<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: violet -> fuchsia -> rose (energetic "rock" feel) -->
    <linearGradient id="bg" x1="120" y1="90" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.55" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <!-- Top-left gloss highlight -->
    <radialGradient id="gloss" cx="0.3" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Center button sheen -->
    <radialGradient id="button" cx="0.42" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E7E7F2"/>
    </radialGradient>
    <!-- Play triangle gradient -->
    <linearGradient id="play" x1="486" y1="468" x2="568" y2="556" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a0a2e" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Squircle background (macOS-style rounded square) -->
  <g filter="url(#shadow)">
    <rect x="62" y="54" width="900" height="900" rx="208" ry="208" fill="url(#bg)"/>
  </g>
  <rect x="62" y="54" width="900" height="900" rx="208" ry="208" fill="url(#gloss)"/>

  <!-- Click wheel -->
  <g>
    <!-- wheel surface -->
    <circle cx="512" cy="512" r="320" fill="#ffffff" fill-opacity="0.16"/>
    <!-- ring -->
    <circle cx="512" cy="512" r="280" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="62"/>
    <!-- subtle inner shading on ring for depth -->
    <circle cx="512" cy="512" r="280" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="62" stroke-dasharray="1 1" opacity="0"/>
    <!-- center button -->
    <circle cx="512" cy="512" r="122" fill="url(#button)"/>
    <circle cx="512" cy="512" r="122" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
    <!-- play triangle -->
    <path d="M486 466 L486 558 L570 512 Z" fill="url(#play)"/>
  </g>
</svg>
